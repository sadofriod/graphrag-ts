server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = /mcp {
    proxy_pass http://mcp-server:3000/mcp;
    proxy_http_version 1.1;
    proxy_set_header Host localhost:3000;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
  }

  location = /healthz {
    proxy_pass http://mcp-server:3000/healthz;
    proxy_set_header Host localhost:3000;
  }

  location ^~ /api/ {
    proxy_pass http://mcp-server:3000;
    proxy_set_header Host localhost:3000;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
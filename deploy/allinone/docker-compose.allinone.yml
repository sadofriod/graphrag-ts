services:
  graphrag-allinone:
    build:
      context: ../..
      dockerfile: deploy/allinone/Dockerfile
    env_file: .env.allinone
    ports:
      - "${MCP_PORT:-3000}:3000"
    volumes:
      - graphrag-pgdata:/var/lib/postgresql/data
      - ./access:/app/access:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    stop_grace_period: 40s

volumes:
  graphrag-pgdata:
